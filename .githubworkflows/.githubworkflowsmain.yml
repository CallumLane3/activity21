name: Collaborative Workflow

on:
  push:
    branches: 
      - main 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create base files if missing
        run: |
          if [ ! -f index.html ]; then
            echo "<!DOCTYPE html><html><head><title>Activity 21</title></head><body><h1>Activity 21</h1></body></html>" > index.html
          fi
          if [ ! -f README.md ]; then
            echo "# Activity 21" > README.md
          fi

      - name: Update index.html and README.md
        run: |
          sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
          echo "- Updated by Team Leader on $(date)" >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "CI/CD: Automated update to index.html and README.md" || exit 0
          git push